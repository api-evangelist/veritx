name: VeriTX
description: >-
  VeriTX Corp. is a veteran-owned blockchain and cybersecurity firm based in
  East Aurora, New York that builds trusted, tamper-evident data and supply-chain
  infrastructure originally developed for the U.S. Air Force under SBIR, STTR, and
  Defense Production Act programs. Its flagship product, QuDEFENSE, is a data-security
  platform that combines post-quantum cryptography with blockchain to protect
  sensitive files in transit and at rest, providing real-time manipulation detection,
  automatic quarantine of tampered data, immutable audit trails, and end-to-end data
  provenance. VeriTX began as a blockchain-powered digital marketplace for aerospace
  additive manufacturing (3D-printed aircraft parts) built on Algorand, and has since
  focused on secure data transfer and provenance for defense, aerospace, medical, and
  industrial customers. QuDEFENSE is offered as an API, an Outlook plugin, and a
  standalone web interface, though VeriTX does not publish a public developer portal,
  OpenAPI specification, or API reference documentation.
